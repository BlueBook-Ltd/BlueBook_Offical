# Deploy bluebook-website to Cloudflare Workers on every push to main.
# Bypasses Cloudflare Dashboard → Connect Git (which only sees SOSOman912).
#
# One-time secrets (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – token with Workers Scripts Edit + Account Read
#   CLOUDFLARE_ACCOUNT_ID  – from Cloudflare dashboard URL / Workers overview

name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Skip instead of failing while the production Cloudflare secrets are not
      # configured on this repo yet. The build still verifies the commit.
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
